[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saferl-research"
version = "0.1.0"
description = "New research-only safe reinforcement-learning components"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["saferl*"]
